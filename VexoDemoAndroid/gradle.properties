# JVM settings for Gradle daemon — improves build performance.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle in parallel where possible.
org.gradle.parallel=true

# Use AndroidX (required by GameActivity, which subclasses AppCompatActivity).
android.useAndroidX=true

# Non-transitive R classes for faster builds and smaller footprint.
android.nonTransitiveRClass=true

[workspace]
resolver = "2"

members = [
    # 1. The core Vexo framework library
    "vexo",

    # 2. Proc-macro crate for #[derive(ComponentState)]
    "vexo/component_state_derive",

    # 2b. Proc-macro crate for column!/row! result-builder macros
    "vexo/vexo_macros",

    # 3. The platform-agnostic application logic (for desktop and mobile exports)
    "shared_app",

    # 4. The executable that runs the shared_app logic on the desktop
    "desktop_demo",

    # 5. Rich UI component library built on vexo
    "vexo_uikit",

    # 6. FontAwesome icon widgets built on vexo (Solid style)
    "vexo_fontawesome",

    # 7. Android cdylib loaded by GameActivity; produces `libmain.so`
    "android_demo",
]

# ------------------------------------------------------------------------
# [workspace.dependencies]
# ------------------------------------------------------------------------
# This section centralizes common dependency versions. Member crates can
# now reference these versions using a syntax like `wgpu = { workspace = true }`
# or `winit = { workspace = true }`.

[workspace.dependencies]
# Graphics & Windowing
wgpu = "30.0.0"
winit = "0.31.0-beta.2"

# Layout Engine
taffy = "0.11"

# Utility
pollster = "0.4.0"
bytemuck = "1.24.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
bitflags = "2.10.0"

# Text Rendering
glyphon = { version = "0.12.0", package = "glyphon-vexo" }

# Foreign Function Interface (for mobile exports)
uniffi = {version = "0.30.0", features = ["cli"] }

# Android activity glue (GameActivity / NativeActivity) — used by vexo and android_demo
android-activity = "0.6"

# Android logging (routes `log::` to logcat)
android_logger = "0.14"

# Image Decoding
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# URL parsing (for ImageCache keys and VexoUserEvent payload)
url = { version = "2", features = ["serde"] }

# HTTP client (blocking, rustls TLS — only used by vexo_http_ureq)
ureq = { version = "2", features = ["tls"] }

# Data Structures
slotmap = "1.0"

# Reactive State
futures-signals = "0.3"

# Clipboard (desktop platforms; iOS uses a stub backend)
arboard = "3"


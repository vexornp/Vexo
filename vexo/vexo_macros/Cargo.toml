[package]
name = "vexo_macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macros for vexo's column!/row! widget-builder macros"
license = "MIT"
repository = "https://github.com/vexornp/Vexo"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"

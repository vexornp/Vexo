[package]
name = "vexo"
version = "0.1.0"
edition = "2021"
description = "A cross-platform UI framework in Rust with Flutter's three-tree architecture"
license = "MIT"
repository = "https://github.com/vexornp/Vexo"

[dependencies]
wgpu = { workspace = true }
winit = { workspace = true }
slotmap = { workspace = true }
lru = { workspace = true }
taffy = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
glyphon = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
uniffi = { workspace = true }
bitflags = { workspace = true }
futures-signals = { workspace = true }
image = { workspace = true }
url = { workspace = true }
component_state_derive = { version = "0.1.0", path = "component_state_derive" }
vexo_macros = { version = "0.1.0", path = "vexo_macros" }

# Clipboard backend for desktop platforms (macOS/Linux/Windows).
# iOS uses UIPasteboard (objc2); Android uses a stub for now (see
# src/platform/mod.rs). Both mobile platforms are excluded here because
# `arboard` does not build for them.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { workspace = true }
rfd = "0.14"

# iOS UIKit / Foundation adapters: clipboard (UIPasteboard), keyboard
# notifications (NSNotificationCenter), and file picker
# (UIDocumentPickerViewController). Versions pinned to what the workspace
# already resolves transitively (objc2 0.6.x, objc2-foundation/ui-kit 0.3.2,
# block2 0.6.x) so this adds no lock churn.
#
# Feature notes:
#  - `NSNotification` exposes NSNotificationCenter + NSNotification.
#  - `NSOperation` + `block2` are required by NSNotificationCenter's
#    block-based `addObserverForName:object:queue:usingBlock:` API.
#  - `NSURL` + `NSArray` are needed by UIDocumentPickerViewController
#    (initForOpeningContentTypes takes &NSArray<UTType>; the delegate
#    callback receives &NSArray<NSURL>).
#  - `UIDocumentPickerViewController` pulls in `UIResponder` +
#    `UIViewController` transitively, but listing them explicitly is
#    clearer. `UIApplication` + `UIWindow` are needed for
#    topmost_view_controller (keyWindow.rootViewController walk).
#  - `objc2-uniform-type-identifiers` (UTType + UTCoreTypes) exposes
#    `UTTypeItem` — the "any file" content type.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = ">=0.6.2, <0.8.0", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSString",
    "NSNotification",
    "NSDictionary",
    "NSValue",
    "NSObject",
    "NSOperation",
    "NSRunLoop",
    "block2",
    "NSURL",
    "NSArray",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "UIPasteboard",
    "UIDocumentPickerViewController",
    "UIApplication",
    "UIViewController",
    "UIResponder",
    "UIWindow",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "UTType",
    "UTCoreTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CADisplayLink"] }
block2 = { version = "0.6.2", default-features = false }

# Android runtime deps:
#  - `android-activity` provides `AndroidApp`, the handle passed to
#    `android_main` and forwarded to winit's `EventLoopBuilder`.
#    Exactly one of `game-activity` / `native-activity` must be enabled
#    graph-wide; we pick `game-activity` (software keyboard works for
#    `TextEdit`; IME composition supported).
#  - `android_logger` routes the `log` facade to logcat.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true, features = ["game-activity"] }
android_logger = { workspace = true }

# Test-only deps:
#  - `image` with `png` feature: the production build only enables `jpeg`
#    (workspace default), but test helpers generate PNG fixtures
#    (`FakeHttpFetch::red_pixel_png`, `solid_color_png`) and the decode
#    tests exercise PNG decoding via `ImageData::from_bytes`. With
#    resolver = "2", these features are only unified during test builds.
[dev-dependencies]
image = { workspace = true, default-features = false, features = ["jpeg", "png"] }
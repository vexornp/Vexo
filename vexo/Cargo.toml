[package]
name = "vexo"
version = "0.1.0"
edition = "2021"
description = "A cross-platform UI framework in Rust with Flutter's three-tree architecture"
license = "MIT"
repository = "https://github.com/vexornp/Vexo"

[dependencies]
wgpu = { workspace = true }
winit = { workspace = true }
slotmap = { workspace = true }
taffy = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
glyphon = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
uniffi = { workspace = true }
bitflags = { workspace = true }
futures-signals = { workspace = true }
image = { workspace = true }
component_state_derive = { version = "0.1.0", path = "component_state_derive" }
vexo_macros = { version = "0.1.0", path = "vexo_macros" }

# Clipboard backend for desktop platforms (macOS/Linux/Windows).
# iOS uses UIPasteboard (objc2); Android uses a stub for now (see
# src/platform/mod.rs). Both mobile platforms are excluded here because
# `arboard` does not build for them.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { workspace = true }

# iOS UIKit / Foundation adapters: clipboard (UIPasteboard) and keyboard
# notifications (UIResponder via NSNotificationCenter). Versions pinned to
# what the workspace already resolves transitively (objc2 0.6.x,
# objc2-foundation/ui-kit 0.3.2, block2 0.6.x) so this adds no lock churn.
#
# Feature notes:
#  - `NSNotification` exposes NSNotificationCenter + NSNotification.
#  - `NSOperation` + `block2` are required by NSNotificationCenter's
#    block-based `addObserverForName:object:queue:usingBlock:` API.
#  - objc2-ui-kit doesn't generate typed accessors for the keyboard
#    notification names / userInfo keys (they're NS_TYPED_EXTENSIBLE_ENUM
#    NSString constants), so we construct them as plain NSStrings and don't
#    need `UIResponder` / `UIApplication` features here.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = ">=0.6.2, <0.8.0", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSString",
    "NSNotification",
    "NSDictionary",
    "NSValue",
    "NSObject",
    "NSOperation",
    "NSRunLoop",
    "block2",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIPasteboard"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CADisplayLink"] }
block2 = { version = "0.6.2", default-features = false }

# Android runtime deps:
#  - `android-activity` provides `AndroidApp`, the handle passed to
#    `android_main` and forwarded to winit's `EventLoopBuilder`.
#    Exactly one of `game-activity` / `native-activity` must be enabled
#    graph-wide; we pick `game-activity` (software keyboard works for
#    `TextEdit`; IME composition supported).
#  - `android_logger` routes the `log` facade to logcat.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true, features = ["game-activity"] }
android_logger = { workspace = true }
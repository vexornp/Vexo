<h2>What cursor color approach?</h2>
<p class="subtitle">The cursor can match text color or use a distinct accent</p>

<div class="options">
  <div class="option" data-choice="match-text" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Match Text Color</h3>
      <p>Cursor uses the same color as the text — simple and consistent</p>
      <div style="font-family: monospace; background: #1a1a2e; padding: 12px; margin-top: 8px; border-radius: 4px;">
        <span style="color: #eee;">Hello Wor</span><span style="color: #eee; animation: blink 0.8s step-end infinite;">|</span>
      </div>
    </div>
  </div>
  <div class="option" data-choice="accent-color" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Accent Color</h3>
      <p>Distinct color for visibility — configurable via TextEdit property</p>
      <div style="font-family: monospace; background: #1a1a2e; padding: 12px; margin-top: 8px; border-radius: 4px;">
        <span style="color: #eee;">Hello Wor</span><span style="color: #4dabf7; animation: blink 0.8s step-end infinite;">|</span>
      </div>
    </div>
  </div>
</div>

<style>
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}
</style>

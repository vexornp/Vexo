[package]
name = "vexo_fontawesome"
version = "0.1.0"
edition = "2021"
description = "FontAwesome (Free, Solid) icon widgets for the Vexo UI framework"
license = "MIT AND OFL-1.1 AND CC-BY-4.0"
repository = "https://github.com/vexornp/Vexo"
readme = "README.md"

[dependencies]
vexo = { version = "0.1.0", path = "../vexo" }
glyphon = { workspace = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
